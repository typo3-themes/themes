services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  KayStrobach\Themes\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Migration/ConversionPlan.php'

  # created with GeneralUtility::makeInstance() (TypoScript dataProcessing, ThemeRepository in hooks and conditions),
  # which needs them public in the container for their constructor injection
  KayStrobach\Themes\DataProcessing\:
    resource: '../Classes/DataProcessing/*'
    public: true
  KayStrobach\Themes\Domain\Repository\ThemeRepository:
    public: true
  KayStrobach\Themes\Utilities\ApplicationContext:
    public: true

  # tag instead of #[AsCommand]: works on TYPO3 12 as well
  KayStrobach\Themes\Command\ConvertIncludesCommand:
    tags:
      - name: console.command
        command: 'themes:convert-includes'
        description: 'Converts <INCLUDE_TYPOSCRIPT: ...> to @import (TYPO3 v14 ignores the old syntax)'
        schedulable: false

  KayStrobach\Themes\TsConfig\Loader:
    public: true
    tags:
      - name: event.listener
        identifier: 'add-site-configuration'
        event: TYPO3\CMS\Core\TypoScript\IncludeTree\Event\ModifyLoadedPageTsConfigEvent
  KayStrobach\Themes\EventListener\AfterTemplatesHaveBeenDeterminedEventListener:
    tags:
      - name: event.listener
        identifier: 'themes/AfterTemplatesHaveBeenDeterminedEventListner'
  KayStrobach\Themes\EventListener\ResolveNestedConstants:
    tags:
      - name: event.listener
        identifier: 'themes/resolve-nested-constants'
        event: TYPO3\CMS\Frontend\Event\ModifyTypoScriptConstantsEvent
  KayStrobach\Themes\EventListener\RewriteLegacyExtensionPaths:
    tags:
      - name: event.listener
        identifier: 'themes/rewrite-legacy-extension-paths'
        event: TYPO3\CMS\Frontend\Event\ModifyTypoScriptConstantsEvent
        # after the nested constants are resolved, they may contain such paths as well
        after: 'themes/resolve-nested-constants'

  KayStrobach\Themes\DataProcessing\FilesDataProcessor:
    tags:
      - name: 'files.data.processor'
        identifier: 'themes'
  KayStrobach\Themes\DataProcessing\HeaderLinkDataProcessor:
    tags:
      - name: 'header-link.data.processor'
        identifier: 'themes'
  KayStrobach\Themes\DataProcessing\ThemesBehaviourDataProcessor:
    tags:
      - name: 'themes-behaviour.data.processor'
        identifier: 'themes'
  KayStrobach\Themes\DataProcessing\ThemesButtonDataProcessor:
    tags:
      - name: 'themes-button.data.processor'
        identifier: 'themes'
  KayStrobach\Themes\DataProcessing\ThemesIconDataProcessor:
    tags:
      - name: 'themes-icon.data.processor'
        identifier: 'themes'
  KayStrobach\Themes\DataProcessing\ThemesResponsiveColumnDataProcessor:
    tags:
      - name: 'themes-responsive-column.data.processor'
        identifier: 'themes'
  KayStrobach\Themes\DataProcessing\ThemesResponsiveDataProcessor:
    tags:
      - name: 'themes-responsive.data.processor'
        identifier: 'themes'
  KayStrobach\Themes\DataProcessing\ThemesVariantsDataProcessor:
    tags:
      - name: 'themes-variants.data.processor'
        identifier: 'themes'
